{% extends "base.html" %}

{% block title %}Edit Perusahaan{% endblock %}
{% block page_title %}Edit Data Perusahaan{% endblock %}

{% block content %}
<div class="content-card">
    <div class="card-header">
        <i class="fas fa-edit"></i>
        <h3>Form Edit Perusahaan</h3>
    </div>
    
    <form method="POST" action="{{ url_for('edit_perusahaan', id=perusahaan.id) }}">
        <!-- Informasi Perusahaan -->
        <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 25px;">
            <h4 style="margin-bottom: 20px; color: var(--text-primary);">
                <i class="fas fa-building"></i> Informasi Perusahaan
            </h4>
            
            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;">
                <div class="form-group">
                    <label for="kode">Kode Perusahaan *</label>
                    <input type="text" id="kode" name="kode" class="form-control" required 
                           value="{{ perusahaan.kode }}">
                </div>
                
                <div class="form-group">
                    <label for="nama">Nama Perusahaan *</label>
                    <input type="text" id="nama" name="nama" class="form-control" required 
                           value="{{ perusahaan.nama }}">
                </div>
            </div>
        </div>
        
        <!-- Profitabilitas -->
        <div style="background: #e7f3ff; padding: 20px; border-radius: 8px; margin-bottom: 25px;">
            <h4 style="margin-bottom: 20px; color: var(--primary-blue);">
                <i class="fas fa-chart-line"></i> Profitabilitas
            </h4>
            
            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;">
                <div class="form-group">
                    <label for="roa">ROA (Return on Assets) *</label>
                    <input type="number" step="0.0001" id="roa" name="roa" class="form-control" required 
                           value="{{ perusahaan.roa }}">
                </div>
                
                <div class="form-group">
                    <label for="laba_operasional">Tingkat Laba Operasional *</label>
                    <input type="number" step="0.0001" id="laba_operasional" name="laba_operasional" 
                           class="form-control" required value="{{ perusahaan.laba_operasional }}">
                </div>
            </div>
        </div>
        
        <!-- Likuiditas -->
        <div style="background: #d1e7dd; padding: 20px; border-radius: 8px; margin-bottom: 25px;">
            <h4 style="margin-bottom: 20px; color: var(--success-green);">
                <i class="fas fa-money-bill-wave"></i> Likuiditas
            </h4>
            
            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;">
                <div class="form-group">
                    <label for="rasio_lancar">Rasio Lancar (Current Ratio) *</label>
                    <input type="number" step="0.0001" id="rasio_lancar" name="rasio_lancar" 
                           class="form-control" required value="{{ perusahaan.rasio_lancar }}">
                </div>
                
                <div class="form-group">
                    <label for="rasio_cepat">Rasio Cepat (Quick Ratio) *</label>
                    <input type="number" step="0.0001" id="rasio_cepat" name="rasio_cepat" 
                           class="form-control" required value="{{ perusahaan.rasio_cepat }}">
                </div>
            </div>
        </div>
        
        <!-- Solvabilitas -->
        <div style="background: #fff3cd; padding: 20px; border-radius: 8px; margin-bottom: 25px;">
            <h4 style="margin-bottom: 20px; color: var(--warning-orange);">
                <i class="fas fa-balance-scale"></i> Solvabilitas
            </h4>
            
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
                <div class="form-group">
                    <label for="utang_nilai_bersih">Total Utang/Total Nilai Bersih *</label>
                    <input type="number" step="0.0001" id="utang_nilai_bersih" name="utang_nilai_bersih" 
                           class="form-control" required value="{{ perusahaan.utang_nilai_bersih }}">
                </div>
                
                <div class="form-group">
                    <label for="rasio_utang">Rasio Utang (Debt Ratio) *</label>
                    <input type="number" step="0.0001" id="rasio_utang" name="rasio_utang" 
                           class="form-control" required value="{{ perusahaan.rasio_utang }}">
                </div>
                
                <div class="form-group">
                    <label for="nilai_bersih_aset">Nilai Bersih/Aset *</label>
                    <input type="number" step="0.0001" id="nilai_bersih_aset" name="nilai_bersih_aset" 
                           class="form-control" required value="{{ perusahaan.nilai_bersih_aset }}">
                </div>
            </div>
        </div>
        
        <!-- Efisiensi -->
        <div style="background: #d1ecf1; padding: 20px; border-radius: 8px; margin-bottom: 25px;">
            <h4 style="margin-bottom: 20px; color: var(--info-cyan);">
                <i class="fas fa-sync-alt"></i> Efisiensi
            </h4>
            
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
                <div class="form-group">
                    <label for="arus_kas">Tingkat Arus Kas *</label>
                    <input type="number" step="0.0001" id="arus_kas" name="arus_kas" 
                           class="form-control" required value="{{ perusahaan.arus_kas }}">
                </div>
                
                <div class="form-group">
                    <label for="arus_kas_liabilitas">Arus Kas terhadap Liabilitas *</label>
                    <input type="number" step="0.0001" id="arus_kas_liabilitas" name="arus_kas_liabilitas" 
                           class="form-control" required value="{{ perusahaan.arus_kas_liabilitas }}">
                </div>
                
                <div class="form-group">
                    <label for="perputaran_aset">Perputaran Total Aset *</label>
                    <input type="number" step="0.0001" id="perputaran_aset" name="perputaran_aset" 
                           class="form-control" required value="{{ perusahaan.perputaran_aset }}">
                </div>
            </div>
        </div>
        
        <!-- Buttons -->
        <div style="display: flex; gap: 15px; justify-content: flex-end;">
            <a href="{{ url_for('data_perusahaan') }}" class="btn btn-secondary">
                <i class="fas fa-times"></i>
                Batal
            </a>
            <button type="submit" class="btn btn-success">
                <i class="fas fa-save"></i>
                Update Data
            </button>
        </div>
    </form>
</div>

<style>
.btn-secondary {
    background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
    color: white;
    padding: 12px 25px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.btn-secondary:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(108, 117, 125, 0.3);
}
</style>
{% endblock %}
